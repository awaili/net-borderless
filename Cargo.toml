[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Aegis Contributors"]

[workspace.dependencies]
# 依赖统一在此声明版本，crate 内用 `dep.workspace = true` 引用。
# M0 起逐步引入：tokio / ipnet / quinn / rustls / axum / rusqlite / ...
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9" # 上游已归档但稳定；1.0 生态定型后再评估迁移
thiserror = "2"
regex = "1"
# SS2022 密码学栈：blake3 子密钥派生 + AEAD（aes-gcm / chacha20poly1305）
blake3 = "1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
# TLS 栈（trojan / 后续 vless 承载）：rustls 全程 ring 后端（纯 Rust，跨平台含 iOS/Android）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
sha2 = "0.10"
# 测试用自签证书（trojan/vless 单元测试 + xray 互通冒烟）
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
base64 = "0.22"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }

# 内部 crate
aegis-rules = { path = "crates/aegis-rules" }
aegis-config = { path = "crates/aegis-config" }
aegis-inbound = { path = "crates/aegis-inbound" }
aegis-outbound = { path = "crates/aegis-outbound" }
aegis-router = { path = "crates/aegis-router" }