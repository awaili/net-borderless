[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Aegis Contributors"]

[workspace.dependencies]
# 依赖统一在此声明版本，crate 内用 `dep.workspace = true` 引用。
# M0 起逐步引入：tokio / ipnet / quinn / rustls / axum / rusqlite / ...
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9" # 上游已归档但稳定；1.0 生态定型后再评估迁移
thiserror = "2"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }

# 内部 crate
aegis-rules = { path = "crates/aegis-rules" }
aegis-config = { path = "crates/aegis-config" }
aegis-inbound = { path = "crates/aegis-inbound" }
aegis-outbound = { path = "crates/aegis-outbound" }
aegis-router = { path = "crates/aegis-router" }