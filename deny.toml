# cargo-deny 配置：许可证白名单 + 依赖禁用清单
# 运行：cargo deny check

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# 分层硬规则（docs/05 §2）未来用 deny 脚本补充：
# - aegis-api 不被任何 crate 依赖
# - aegis-observe 不依赖 aegis-router
multiple-versions = "warn"